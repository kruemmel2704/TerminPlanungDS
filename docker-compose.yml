services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=sqlite:///database.db
      - WHATSAPP_API_URL=http://waha:3000
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - waha
    networks:
      - app-network

  waha:
    image: devlikeapro/waha
    container_name: waha
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./.sessions:/app/.sessions
    environment:
      - WAHA_PRINT_QR=true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
